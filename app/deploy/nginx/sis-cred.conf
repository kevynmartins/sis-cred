# Copie para /etc/nginx/sites-available/sis-cred.conf e crie o symlink em sites-enabled.
# Ajuste server_name e o caminho de "root" para o seu ambiente.
# O bloco HTTPS abaixo é preenchido automaticamente pelo `certbot --nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name app.suaempresa.com.br;

    root /opt/sis-cred/dist;
    index index.html;

    client_max_body_size 20m;

    # Frontend estático (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API Node, que escuta apenas em loopback
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache agressivo para assets com hash no nome (gerados pelo Vite)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
